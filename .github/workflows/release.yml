name: Release Canvas Horizon

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Node.js のセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 依存関係のインストール
        run: npm ci

      - name: バージョンとタグの自動判定・自動アップデート
        id: versioning
        run: node scripts/prepare-release.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Windows アプリのビルド
        run: npx electron-builder --win --publish never

      - name: ポータブルZIPの作成
        run: powershell -NoProfile -Command "Compress-Archive -Path 'dist\win-unpacked\*' -DestinationPath 'dist\Canvas-Horizon-Windows-x64-Portable.zip' -Force"

      - name: GitHub Releases へ一括完全公開
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          files: |
            dist/Canvas-Horizon-Setup-*.exe
            dist/Canvas-Horizon-Setup-*.exe.blockmap
            dist/Canvas-Horizon-Windows-x64-Portable.zip
            dist/latest.yml
            dist/win-unpacked/resources/app.asar
          draft: false
          prerelease: false
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
