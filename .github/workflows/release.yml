name: Release Canvas Horizon

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Node.js のセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 依存関係のインストール
        run: npm ci

      - name: Windows アプリのビルド
        run: npx electron-builder --win --publish never

      - name: GitHub Releases へ一括公開
        shell: pwsh
        run: |
          $exe      = (Get-ChildItem dist -Filter "Canvas Horizon Setup *.exe"          | Where-Object { $_.Extension -eq ".exe" } | Select-Object -First 1).FullName
          $blockmap = (Get-ChildItem dist -Filter "Canvas Horizon Setup *.exe.blockmap" | Select-Object -First 1).FullName
          $yml      = "dist\latest.yml"
          Write-Host "exe:      $exe"
          Write-Host "blockmap: $blockmap"
          Write-Host "yml:      $yml"
          gh release create "${{ github.ref_name }}" `
            --title "${{ github.ref_name }}" `
            --notes "Release ${{ github.ref_name }}" `
            "$exe" "$blockmap" "$yml"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
