[package]
name = "canvas-horizon"
version = "1.4.0"
description = "Canvas Horizon - Rust Native Desktop Client for Canvas LMS"
authors = ["shizengakari"]
license = "MIT"
repository = "https://github.com/shizengakari/CanvasLMS-Horizon"
edition = "2024"
rust-version = "1.90"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
regex = "1.10"
tauri = { version = "2.12.3" }
tauri-plugin-log = "2"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["multipart"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "multipart", "rustls-tls"] }
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
urlencoding = "2.1"
url = "2.5"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
open = "5"
rfd = "0.15"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
